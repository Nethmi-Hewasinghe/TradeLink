services:
  - type: web
    name: service-request-board-api
    env: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 5000

      - key: MONGO_URI
        sync: false

      - key: JWT_SECRET
        generateValue: true